[package]
name = "dbcraft-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Fast, native IDE for Oracle SQL and PL/SQL"
authors = ["Remo Laubacher"]
homepage = "https://github.com/ortic/dbcraft"
repository = "https://github.com/ortic/dbcraft"

[[bin]]
name = "dbcraft"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
csv = "1"
regex.workspace = true
anyhow.workspace = true
eframe.workspace = true
egui.workspace = true
egui_dock.workspace = true
egui_extras.workspace = true
egui_plot = "0.37"
keyring.workspace = true
rfd = "0.17"
dbcraft-ai.workspace = true
dbcraft-compare.workspace = true
dbcraft-config.workspace = true
dbcraft-data.workspace = true
dbcraft-db.workspace = true
dbcraft-debugger.workspace = true
dbcraft-lsp-core.workspace = true
dbcraft-monitor.workspace = true
dbcraft-plsql.workspace = true
dbcraft-ui.workspace = true
serde.workspace = true
# Long MySQL values are checked by their digest when results are edited
# (data_edit.rs).
sha2 = "0.11"
# Windows Firewall settings (firewall.rs).
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Under WSLg the window opens through X11 (main.rs, #88); eframe's winit.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }

[build-dependencies]
# The icon and version resource of dbcraft.exe (build.rs).
embed-resource = "3"

[dev-dependencies]
ron = "0.12"
egui_kittest = { version = "0.36", features = ["eframe", "wgpu", "snapshot"] }
# Changes a SQLite file behind DbCraft's back (screenshots.rs tests).
rusqlite.workspace = true
# Reads the fonts' character maps (theme.rs tests); egui's has_glyph misses
# the characters of the font that holds its replacement glyph.
skrifa = "0.44"

# Installers and packages: `cargo packager --release -p dbcraft-app` (see README).
[package.metadata.packager]
productName = "DbCraft"
identifier = "com.ortic.dbcraft"
publisher = "Remo Laubacher"
copyright = "Copyright © 2026 Remo Laubacher"
category = "DeveloperTool"
description = "Fast, native IDE for Oracle SQL and PL/SQL"
longDescription = """
DbCraft covers the daily work of an Oracle developer: writing and running SQL,
editing and compiling PL/SQL, debugging, browsing objects, editing data,
comparing schemas and monitoring sessions. Connects to Oracle directly; no
Oracle client libraries are needed."""
homepage = "https://github.com/ortic/dbcraft"
licenseFile = "../../LICENSE-MIT"
# `cargo build --release -p dbcraft-app`, as an alias in .cargo/config.toml.
beforePackagingCommand = "cargo package-build"
outDir = "../../target/packages"
binariesDir = "../../target/release"
icons = ["../../assets/icon/dbcraft-32.png", "../../assets/icon/dbcraft-128.png", "../../assets/icon/dbcraft-256.png", "../../assets/icon/dbcraft-512.png", "../../assets/icon/dbcraft.ico", "../../assets/icon/dbcraft.icns"]
resources = ["../../README.md", "../../CHANGELOG.md", "../../LICENSE-MIT", "../../LICENSE-APACHE"]

[[package.metadata.packager.binaries]]
path = "dbcraft"
main = true

[[package.metadata.packager.fileAssociations]]
extensions = ["sql"]
mimeType = "application/sql"
description = "SQL script"
name = "SQL script"
role = "editor"

[[package.metadata.packager.fileAssociations]]
extensions = ["pks", "pkb", "prc", "fnc", "tps", "tpb", "trg", "pls", "plb"]
mimeType = "text/x-plsql"
description = "PL/SQL source"
name = "PL/SQL source"
role = "editor"

[package.metadata.packager.deb]
desktopTemplate = "../../assets/linux/com.ortic.dbcraft.desktop"
section = "devel"

[package.metadata.packager.deb.files]
"../../assets/linux/com.ortic.dbcraft.metainfo.xml" = "usr/share/metainfo/com.ortic.dbcraft.metainfo.xml"
"../../assets/icon/dbcraft.svg" = "usr/share/icons/hicolor/scalable/apps/dbcraft.svg"

[package.metadata.packager.appimage.files]
"../../assets/linux/com.ortic.dbcraft.metainfo.xml" = "usr/share/metainfo/com.ortic.dbcraft.metainfo.xml"

[package.metadata.packager.macos]
minimumSystemVersion = "11.0"

[package.metadata.packager.nsis]
installerIcon = "../../assets/icon/dbcraft.ico"
installMode = "perMachine"

[package.metadata.packager.wix]
languages = ["en-US"]
