[package]
name = "dbcraft-db"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The Oracle Instant Client (ODPI-C) instead of the pure-Rust driver, for
# setups the thin driver can't handle (Native Network Encryption required by
# the server, 11.2): `cargo build -p dbcraft-app --features dbcraft-db/thick`.
thick = ["dep:oracle"]

[dependencies]
# Which instant a region's local time is, where the clocks went back (#481);
# the driver brings both in already.
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
futures-util.workspace = true
mysql.workspace = true
mysql_common.workspace = true
oracle = { workspace = true, optional = true }
oracledb.workspace = true
dbcraft-config.workspace = true
dbcraft-plsql.workspace = true
russh.workspace = true
rusqlite.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tiberius.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
tokio-postgres-rustls.workspace = true
tokio-util.workspace = true
tracing.workspace = true
webpki-roots.workspace = true

# Security keys: CTAP2 over USB HID on Linux and macOS. The tests run it
# against a key in software everywhere.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
aes.workspace = true
ring.workspace = true

[target.'cfg(not(any(target_os = "linux", target_os = "macos")))'.dev-dependencies]
aes.workspace = true
ring.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
hidapi.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Networking_WindowsWebServices",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[[example]]
name = "thin_probe"
# Compares the thin driver with the Instant Client.
required-features = ["thick"]
