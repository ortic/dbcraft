name: Release

# Builds packages for every platform and publishes them as a GitHub release
# when a version tag is pushed. Each platform comes in two flavors: the
# pure-Rust driver (no Oracle client needed) and `-instantclient`, built with
# `dbcraft-db/thick` for servers the pure-Rust driver can't reach (Native
# Network Encryption required, 11.2). ODPI-C loads the Instant Client at run
# time, so building needs no client.
#
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PACKAGER_VERSION: "0.11.8"

jobs:
  package:
    name: ${{ matrix.platform.name }}${{ matrix.flavor.suffix }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            formats: deb,appimage
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            formats: wix,nsis
          - name: windows-aarch64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            formats: wix,nsis
          - name: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            formats: app,dmg
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            formats: app,dmg
        flavor:
          - suffix: ""
            build: build --release -p dbcraft-app
          - suffix: -instantclient
            build: build --release -p dbcraft-app --features dbcraft-db/thick
    runs-on: ${{ matrix.platform.os }}
    env:
      # The build behind beforePackagingCommand (`cargo package-build`).
      CARGO_ALIAS_PACKAGE_BUILD: ${{ matrix.flavor.build }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform.target }}${{ matrix.flavor.suffix }}

      - name: Install cargo-packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@${{ env.CARGO_PACKAGER_VERSION }}

      # AppImage tooling runs through FUSE on the runner.
      - name: Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      # cargo-packager downloads WiX 3.11, which can't build arm64; 3.14 can.
      # It takes the WiX it finds in its tools folder.
      - name: WiX 3.14
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o wix.zip \
            https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip
          echo "6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31  wix.zip" | sha256sum -c
          7z x -y -o"$LOCALAPPDATA/.cargo-packager/WixTools" wix.zip > /dev/null

      # ring builds its aarch64 assembly for MSVC with clang.
      - name: Windows ARM64 packaging dependencies
        if: matrix.platform.target == 'aarch64-pc-windows-msvc'
        shell: bash
        run: |
          if ! command -v clang >/dev/null; then
            choco install llvm -y --no-progress
            echo "C:\Program Files\LLVM\bin" >> "$GITHUB_PATH"
          fi

      - name: Build packages
        shell: bash
        run: |
          cargo packager --release -p dbcraft-app \
            --target ${{ matrix.platform.target }} \
            --formats ${{ matrix.platform.formats }} \
            --out-dir "${{ github.workspace }}/dist"
        env:
          # Optional signing material; see docs/RELEASING.md.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # dbcraft_0.4.0_amd64.deb -> dbcraft-instantclient_0.4.0_amd64.deb, so
      # both flavors fit in one release.
      - name: Name the flavor's packages
        if: matrix.flavor.suffix != ''
        shell: bash
        run: |
          shopt -s nullglob
          cd dist
          for f in *.deb *.AppImage *.msi *-setup.exe *.dmg; do
            mv "$f" "${f/_/${{ matrix.flavor.suffix }}_}"
          done
          ls

      - name: Plain binary archive
        shell: bash
        run: |
          bin=dbcraft
          [ "${{ runner.os }}" = "Windows" ] && bin=dbcraft.exe
          mkdir -p dist/archive
          # beforePackagingCommand builds for the runner's own target.
          cp "target/release/$bin" README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE dist/archive/
          cd dist/archive
          # A branch run by hand (feat/x) has a slash in its name.
          name="dbcraft-${GITHUB_REF_NAME//\//-}-${{ matrix.platform.name }}${{ matrix.flavor.suffix }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../$name.zip" .
          else
            tar czf "../$name.tar.gz" .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dbcraft-${{ matrix.platform.name }}${{ matrix.flavor.suffix }}
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.msi
            dist/*-setup.exe
            dist/*.dmg
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: true
